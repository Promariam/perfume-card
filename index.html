<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Young+Serif&display=swap" rel="stylesheet">
<style>
    body {
        background-color: hsl(30, 38%, 92%);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .main {
        display: flex;
        border-radius: 10px;
        overflow: hidden;
        max-width: 550px;
        width: 100%;
    }
    .content {
        padding: 20px;
        background-color: white;
    }
    p {
        font-family: "Montserrat", sans-serif;
        color: hsl(228, 12%, 48%);
    }
    h1 {
        font-family: "Fraunces", serif;
    }
    .bigimg {
        width: 50%;
    }
    .cart {
        font-family: "Montserrat", sans-serif;
        background-color: hsl(158, 36%, 37%);
        color: white;
        text-align: center;
        padding: 10px;
        border-radius: 10px;
    }
    .cart:hover {
        background-color: hsl(158, 42%, 18%);
    }
    .price {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    @media (max-width: 600px) {
        .main {
            flex-direction: column;
            max-width: 340px;
            width: auto;
        }

        .bigimg {
            width: 100%;
            height: 240px;
        }
        .content{
            padding: 30px;
        }
    }


    
</style>
</head>
<body>
    <div class="main">
        <img class="bigimg" src="https://i.ibb.co/XfNyzVqC/image-product-desktop.jpg" alt="image">
        <div class="content">
            <p>P E R F U M E</p>
            <h1>Gabrielle Essence Eau De Parfum</h1>
            <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
            <div class="price">
                <h1 style="color: hsl(158, 36%, 37%);">$149.99</h1>
                <p><del>$169.99</del></p>
            </div>
            <div class="cart">
                <img src="file:///C:/Users/PC7/Downloads/icon-cart.svg" alt="icon cart">
                Add to Cart
            </div>
        </div>
    </div>
</body>
</html>
